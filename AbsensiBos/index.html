<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Attendance Management System</title>
    <!-- Tailwind CSS untuk styling yang rapi dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JavaScript Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">AbsensiBos Login</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan masuk menggunakan akun Anda</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Masukkan username">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Masukkan password">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition duration-200">
                Masuk
            </button>
        </form>

        <!-- Pesan Error / Sukses -->
        <div id="message" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        // Konfigurasi Supabase milik Anda
        const supabaseUrl = 'https://zasxkgtqmigywdykgjcq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inphc3hrZ3RxbWlneXdkeWtnamNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NzM0NzQsImV4cCI6MjEwNTQ0OTQ3NH0.jjVDBssA6-3q4HIuq6UnH6zcgkq0u3VbgP7gs4FFOG8';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function handleLogin(event) {
            event.preventDefault(); // Mencegah form reload halaman secara default

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Ubah tombol jadi loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Memeriksa...';
            messageDiv.textContent = '';

            try {
                // Melakukan query ke tabel 'users' di Supabase
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', usernameInput)
                    .eq('password', passwordInput)
                    .single(); // Mengambil 1 data yang cocok

                if (error || !data) {
                    throw new Error('Username atau password salah!');
                }

                // Jika login berhasil
                messageDiv.className = 'mt-4 text-center text-sm font-medium text-green-600';
                messageDiv.textContent = `Login Berhasil! Selamat datang, ${data.nama}. Mengalihkan...`;

                // Menyimpan data sesi sederhana ke LocalStorage browser
                localStorage.setItem('user', JSON.stringify(data));

                // Simulasi pindah halaman (nanti kita buat halaman dashboard/absennya)
                setTimeout(() => {
                    alert(`Berhasil masuk sebagai ${data.role} (${data.nama})!`);
                    // window.location.href = 'dashboard.html'; // Aktifkan kalau halamannya sudah ada
                }, 1000);

            } catch (err) {
                // Jika gagal
                messageDiv.className = 'mt-4 text-center text-sm font-medium text-red-600';
                messageDiv.textContent = err.message || 'Terjadi kesalahan pada sistem.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Masuk';
            }
        }
    </script>
</body>
</html>
